<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zen.Hua</title>
  
  <script src="/lunar.js"></script>
  
  <style>
    /* Samsung OneUI 8.5 Design System */
      @font-face {
        font-family: 'Samsung One';
        src: local('Samsung One'), local('SamsungOne');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --oneui-bg: #f5f6fa; --oneui-surface: #ffffff; --oneui-surface-strong: #f1f3f8; --oneui-primary: #2674e8;
        --oneui-text-primary: #111111; --oneui-text-secondary: #767676;
        --oneui-outline: transparent; --oneui-elevated-shadow: none;
        --center-accent: #155eb9;
        --star-kim: #616369; --star-thuy: #000000; --star-hoa: #FE0303; --star-tho: #FF9F00; --star-moc: #049A04;
        --oneui-radius-card: 28px; --oneui-radius-pill: 999px;
        --oneui-easing: cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme="dark"] {
          --oneui-bg: #0a0a0c;
          --oneui-surface: #16171a;
          --oneui-surface-strong: #1f2128;
          --oneui-text-primary: #f0f0f2;
          --oneui-text-secondary: #8d9096;
          --oneui-outline: transparent; --oneui-elevated-shadow: none;
          --center-accent: #72adff;
          --star-kim: #b0b3bb;
          --star-thuy: #84b7ff;
          --star-hoa: #ff7b7b;
          --star-tho: #ffb24a;
          --star-moc: #7ed97e;
      }
      * { box-sizing: border-box; font-family: 'Samsung One', system-ui, sans-serif; }
      html { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      body { 
        background: var(--oneui-bg);
        color: var(--oneui-text-primary); 
        margin: 0; 
        overflow: hidden; 
        height: 100vh; 
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      .app-brand {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 40;
        font-size: 11px;
        font-weight: 200;
        letter-spacing: 0.04em;
        color: rgba(17, 17, 17, 0.25);
        text-align: right;
        pointer-events: none;
      }
      html[data-theme="dark"] .app-brand { color: rgba(255, 255, 255, 0.20); }
      .screen {
        display: flex;
        flex-direction: column;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: transform 0.4s var(--oneui-easing), opacity 0.3s ease;
      }
      .screen.hidden {
        transform: translate3d(0, 80px, 0);
        opacity: 0;
        pointer-events: none;
        z-index: 0;
      }
      .screen:not(.hidden) {
        z-index: 10;
      }
      .form-shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }
      .page-viewport { flex: 1; min-width: 0; overflow: hidden; }
      .page-track { display: flex; gap: 20px; height: 100%; width: max-content; will-change: transform; transition: transform 420ms var(--oneui-easing); }
      .app-page { display: flex; flex-direction: column; flex: 0 0 100vw; width: 100vw; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 108px; }
      .bottom-nav { position: absolute; z-index: 30; bottom: max(16px, calc(env(safe-area-inset-bottom) + 10px)); left: 50%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: min(342px, calc(100vw - 32px)); padding: 5px; transform: translateX(-50%); border-radius: 26px; background: color-mix(in srgb, var(--oneui-surface-strong) 92%, transparent); backdrop-filter: blur(18px); }
      .nav-item { min-height: 62px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border: 0; border-radius: 21px; background: transparent; color: var(--oneui-text-secondary); font: inherit; font-size: 11px; font-weight: 720; cursor: pointer; transition: background-color 180ms ease, color 180ms ease, transform 180ms ease; }
      .nav-item-icon { width: 19px; height: 19px; display: block; opacity: .78; }
      html[data-theme="dark"] .nav-item-icon { filter: invert(1); }
      .nav-item.active { background: var(--oneui-text-primary); color: var(--oneui-surface); }
      .nav-item.active .nav-item-icon { opacity: 1; filter: invert(1); }
      .nav-item:active { transform: scale(.96); }
      html[data-theme="dark"] .nav-item.active .nav-item-icon { filter: none; }
    
    .oneui-header { padding: max(88px, calc(env(safe-area-inset-top) + 52px)) 28px 22px; }
    .header-title { font-size: clamp(40px, 11vw, 52px); line-height: 0.98; letter-spacing: -2.6px; font-weight: 780; margin: 0 0 12px; }
    .header-subtitle { max-width: 260px; font-size: 14px; line-height: 1.42; color: var(--oneui-text-secondary); margin: 0; }
    
    .oneui-card-form { background: transparent; border: 0; padding: 10px 24px calc(32px + env(safe-area-inset-bottom)); flex: 1; overflow-y: auto; }
    .input-group { margin-bottom: 22px; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    .oneui-label { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; color: var(--oneui-text-secondary); margin: 0 4px 10px; display: block; }
    .oneui-input, .oneui-input-inline { width: 100%; background: var(--oneui-surface-strong); border: 0; padding: 17px 16px; border-radius: 18px; color: var(--oneui-text-primary); font-size: 16px; transition: box-shadow 160ms ease, background-color 160ms ease; }
    .oneui-input:focus { outline: 0; background: var(--oneui-surface-strong); box-shadow: inset 0 -2px 0 var(--oneui-primary); }
    .date-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    .date-control { display: flex; align-items: center; min-width: 0; padding: 0 12px; background: var(--oneui-surface-strong); border: 0; border-radius: 18px; color: var(--oneui-text-primary); transition: box-shadow 160ms ease; }
    .date-segment { min-width: 0; border: 0; outline: 0; padding: 16px 0; background: transparent; color: var(--oneui-text-primary); font: inherit; font-size: 15px; text-align: center; }
    .date-segment::placeholder { color: var(--oneui-text-secondary); opacity: 1; }
    .date-segment.day, .date-segment.month { width: 2.5ch; }
    .date-segment.year { width: 4.8ch; }
    .date-separator { flex: 0 0 auto; color: var(--oneui-text-primary); font-size: 16px; font-weight: 400; }
    .calendar-suffix { display: none; flex: 0 0 auto; margin-left: 4px; color: var(--oneui-text-secondary); font-size: 13px; font-weight: 600; }
    .calendar-suffix.visible { display: inline; }
    .time-control { display: flex; align-items: center; padding: 0 12px; background: var(--oneui-surface-strong); border: 0; border-radius: 18px; color: var(--oneui-text-primary); transition: box-shadow 160ms ease; }
    .time-segment { width: 2.5ch; min-width: 0; border: 0; outline: 0; padding: 16px 0; background: transparent; color: var(--oneui-text-primary); font: inherit; font-size: 15px; text-align: center; }
    .time-segment::placeholder { color: var(--oneui-text-secondary); opacity: 1; }
    .time-separator { color: var(--oneui-text-primary); font-size: 16px; font-weight: 400; }
    
    .date-control:focus-within, .time-control:focus-within { background: var(--oneui-surface-strong); box-shadow: inset 0 -2px 0 var(--oneui-primary); }
    .oneui-toggle-group { display: flex; background: var(--oneui-surface-strong); padding: 4px; border: 0; border-radius: 20px; }
    .toggle-btn { flex: 1; border: none; background: transparent; padding: 13px; border-radius: 16px; color: var(--oneui-text-secondary); font-size: 15px; font-weight: 700; cursor: pointer; transition: color 160ms ease, background-color 160ms ease, box-shadow 160ms ease; }
    .toggle-btn.active { background: var(--oneui-surface); color: var(--oneui-primary); box-shadow: none; }
    .calendar-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .calendar-option { border: 0; border-radius: 18px; padding: 13px 14px; background: var(--oneui-surface-strong); color: var(--oneui-text-secondary); font: inherit; font-weight: 700; cursor: pointer; transition: background-color 160ms ease, color 160ms ease; }
    .calendar-option.active { background: var(--oneui-text-primary); color: var(--oneui-surface); }
    .oneui-btn-primary { min-height: 58px; background: var(--oneui-primary); color: #ffffff; border: none; width: 100%; padding: 16px 20px; border-radius: var(--oneui-radius-pill); font-size: 16px; font-weight: 750; letter-spacing: 0.01em; margin: 12px 0 4px; cursor: pointer; box-shadow: none; transition: transform 160ms ease, filter 160ms ease; }
    .oneui-btn-primary:active, .header-download:active { transform: scale(0.98); filter: brightness(0.93); }
    .settings-page, .library-page { padding: max(88px, calc(env(safe-area-inset-top) + 52px)) 24px 124px; }
    .page-heading { margin: 0 4px 28px; font-size: clamp(34px, 9vw, 44px); line-height: 1; letter-spacing: -2px; }
    .page-description { margin: -16px 4px 28px; color: var(--oneui-text-secondary); font-size: 14px; line-height: 1.45; }
    .settings-list, .library-list { display: grid; gap: 14px; }
    .setting-row, .library-card { background: var(--oneui-surface-strong); border-radius: 22px; padding: 18px; }
    .setting-row label, .setting-title { display: block; font-size: 14px; font-weight: 750; margin-bottom: 8px; }
    .setting-hint, .empty-library { color: var(--oneui-text-secondary); font-size: 13px; line-height: 1.42; }
    .theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
    .theme-option { min-height: 42px; border: 0; border-radius: 14px; background: var(--oneui-surface); color: var(--oneui-text-secondary); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .theme-option.active { background: var(--oneui-text-primary); color: var(--oneui-surface); }
    html:not([data-theme="dark"]) .oneui-input, html:not([data-theme="dark"]) .oneui-input-inline, html:not([data-theme="dark"]) .date-control, html:not([data-theme="dark"]) .time-control, html:not([data-theme="dark"]) .oneui-toggle-group, html:not([data-theme="dark"]) .calendar-option, html:not([data-theme="dark"]) .setting-row, html:not([data-theme="dark"]) .library-card { background: #ffffff; box-shadow: 0 8px 22px rgba(26, 40, 68, .055); }
    html:not([data-theme="dark"]) .bottom-nav { background: rgba(255,255,255,.84); box-shadow: 0 10px 28px rgba(26, 40, 68, .12); }
    html:not([data-theme="dark"]) .toggle-btn.active, html:not([data-theme="dark"]) .calendar-option.active { background: #111111; color: #ffffff; box-shadow: none; }
    html:not([data-theme="dark"]) .icon-btn-back, html:not([data-theme="dark"]) .header-bookmark, html:not([data-theme="dark"]) .header-download { background: #ffffff; box-shadow: 0 7px 18px rgba(26, 40, 68, .13); }
    html:not([data-theme="dark"]) .oneui-card-form .input-group { filter: none; }
    .library-section-title { margin: 4px 4px 8px; color: var(--oneui-text-secondary); font-size: 13px; font-weight: 750; }
    .library-card { width: 100%; border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
    .library-card + .library-card { margin-top: 2px; }
    .library-card-name { display: block; font-weight: 780; font-size: 16px; margin-bottom: 5px; }
    .library-card-detail { color: var(--oneui-text-secondary); font-size: 13px; line-height: 1.45; }
    .star-element { display: inline-block; margin: 1px 4px 4px 0; padding: 2px 6px; border-radius: 999px; font-size: 12px; line-height: 1.4; font-weight: 700; }
    .star-element.kim { color: var(--star-kim); }
    .star-element.thuy { color: var(--star-thuy); }
    .star-element.hoa { color: var(--star-hoa); }
    .star-element.tho { color: var(--star-tho); }
    .star-element.moc { color: var(--star-moc); }
    .star-element.kim::before { content: '• '; }
    .star-element.thuy::before { content: '• '; }
    .star-element.hoa::before { content: '• '; }
    .star-element.tho::before { content: '• '; }
    .star-element.moc::before { content: '• '; }
    
    .oneui-compact-header { display: flex; align-items: center; gap: 10px; padding: 20px 20px 36px; background: linear-gradient(180deg, var(--oneui-bg) 0%, color-mix(in srgb, var(--oneui-bg) 72%, transparent) 58%, transparent 100%); z-index: 10; border: 0; }
    .icon-btn-back, .header-download, .header-bookmark { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 44px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: var(--oneui-surface-strong); color: var(--oneui-text-primary); box-shadow: none; cursor: pointer; transition: transform 160ms ease, background-color 160ms ease; }
    .header-bookmark { margin-left: auto; }
    .header-download { margin-left: 0; }
    .header-icon { width: 22px; height: 22px; display: block; }
    html[data-theme="dark"] .header-icon { filter: invert(1); }
    .icon-btn-back:active, .header-download:active, .header-bookmark:active { transform: scale(0.94); background: color-mix(in srgb, var(--oneui-surface-strong) 72%, var(--oneui-text-primary)); }
    .header-bookmark.active { background: var(--oneui-primary); }
    .header-bookmark.active .header-icon { filter: invert(1); }
    .header-download.downloaded { animation: download-success 700ms var(--oneui-easing); background: #20a660; }
    .header-download.downloaded .header-icon { filter: invert(1); }
    @keyframes download-success { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.17); } }
    
    /* Grid Canvas */
    .viewport-mask { flex: 1; overflow: hidden; position: relative; touch-action: none; background: var(--oneui-bg); min-width: 100%; min-height: 100%; }
    .chart-grid { display: grid; grid-template-columns: repeat(4, 250px); grid-template-rows: repeat(4, 337px); position: absolute; width: 1000px; height: 1348px; transform-origin: 0 0; transform: translate3d(var(--x), var(--y), 0) scale(var(--scale)); will-change: transform; }
    
    .p-0 { grid-column: 1; grid-row: 1; }
    .p-1 { grid-column: 2; grid-row: 1; }
    .p-2 { grid-column: 3; grid-row: 1; }
    .p-3 { grid-column: 4; grid-row: 1; }
    .p-4 { grid-column: 1; grid-row: 2; }
    .p-5 { grid-column: 4; grid-row: 2; }
    .p-6 { grid-column: 1; grid-row: 3; }
    .p-7 { grid-column: 4; grid-row: 3; }
    .p-8 { grid-column: 1; grid-row: 4; }
    .p-9 { grid-column: 2; grid-row: 4; }
    .p-10 { grid-column: 3; grid-row: 4; }
    .p-11 { grid-column: 4; grid-row: 4; }
    
    .center-info { grid-column: 2 / span 2; grid-row: 2 / span 2; background: var(--oneui-bg); display: flex; flex-direction: column; text-align: center; padding: 16px 20px; }
    .center-metadata { display: flex; flex: 1; min-height: 0; flex-direction: column; align-items: center; justify-content: center; color: var(--oneui-text-primary); }
    .center-name, .center-highlight { color: var(--center-accent); font-weight: 800; }
    .center-accent { color: var(--center-accent); }
    .center-name { margin: 0; font-size: 20px; line-height: 1.25; }
    .center-timezone { margin: 2px 0 5px; color: var(--center-accent); font-size: 15px; }
    .center-date-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 430px; margin-bottom: 8px; font-size: 16px; line-height: 1.55; }
    .center-date-grid span { display: block; }
    .center-date-grid .center-date-label { font-weight: 500; }
    .center-line { margin: 2px 0; font-size: 16px; line-height: 1.32; }
    .center-highlight { font-size: 17px; }
    .center-spacer { height: 12px; flex: 0 0 12px; }
    .center-view-date { flex: 0 0 auto; width: 100%; margin-top: 8px; }
    .center-view-date label { display: block; font-size: 12px; color: var(--oneui-text-secondary); }
    .center-view-date .date-control { width: 100%; justify-content: center; margin-top: 4px; }
    .center-view-date .date-segment { padding: 10px 0; }
    .tuan-triet-marker { position: absolute; z-index: 20; min-width: 116px; padding: 2px 10px; transform: translate(-50%, -50%); color: #ffffff; font-size: 13px; font-weight: 800; line-height: 1.15; text-align: center; pointer-events: none; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }
    .tuan-marker { background: #829400; }
    .triet-marker { background: #2865ad; }
    .tuan-triet-shared-marker { background: #16a34a; }
    .palace { background: var(--oneui-surface); border: 1px solid var(--oneui-bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: visible; position: relative; }
    .palace-header { position: relative; min-height: 44px; }
    .palace-left-meta, .palace-right-meta { position: absolute; top: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--oneui-text-secondary); line-height: 1.2; padding-top: 3px;}
    .palace-left-meta { left: 0; }
    .palace-right-meta { right: 0; text-align: right; }
    .palace-title { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: calc(100% - 100px); display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; z-index: 6; }
    .palace-title.kim { color: var(--star-kim); }
    .palace-title.moc { color: var(--star-moc); }
    .palace-title.thuy { color: var(--star-thuy); }
    .palace-title.hoa { color: var(--star-hoa); }
    .palace-title.tho { color: var(--star-tho); }
    .palace-major-stars { position: absolute; top: 33px; left: 50%; transform: translateX(-50%); width: calc(100% - 48px); box-sizing: border-box; display: flex; flex-direction: column; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 52px; margin-top: 0; z-index: 5; }
    .palace-major-stars span { font-size: 14px; }
    .palace-middle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; flex: 1; padding-top: 22px; align-items: start; }
    .palace-star-col { display: block; gap: 4px; min-height: 0; align-self: start; width: 100%; max-width: 100%; overflow: visible; }
    .palace-transit-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .palace-star-list { display: block; gap: 2px; overflow: visible; font-size: 12px; width: 100%; max-width: 100%; }
    .palace-meta-grid { display: none; }
    .palace-meta-box { display: none; }
    .palace-meta-band { display: none; }
    .palace-bottom { position: relative; height: 44px; font-size: 13px; }
    .palace-bottom-left, .palace-bottom-right { position: absolute; bottom: 6px; font-size: 13px; color: var(--oneui-text-secondary); }
    .palace-bottom-left { left: 6px; }
    .palace-bottom-right { right: 6px; }
    .palace-bottom-center { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .palace-trang-sinh { font-weight: 700; font-size: 13px; }
    .palace-lunar-mansion { font-size: 13px; }
    .star-chip { display: inline-block; padding: 0px 8px; border-radius: 999px; font-size: 14px; line-height: 1.25; font-weight: 700; color: var(--oneui-text-primary); white-space: nowrap; overflow: visible; width: fit-content; margin-bottom: 2px; }
    .star-chip.major { font-size: 15px; padding: 0px 8px; text-transform: uppercase; }
    .star-chip.kim { color: var(--star-kim); }
    .star-chip.thuy { color: var(--star-thuy); }
    .star-chip.hoa { color: var(--star-hoa); }
    .star-chip.tho { color: var(--star-tho); }
    .star-chip.moc { color: var(--star-moc); }

    .star-chip.transit.kim { background: rgba(97,99,105,0.12); color: var(--star-kim); }
    .star-chip.transit.thuy { background: rgba(0,0,0,0.08); color: var(--star-thuy); }
    .star-chip.transit.hoa { background: rgba(254,3,3,0.12); color: var(--star-hoa); }
    .star-chip.transit.tho { background: rgba(255,159,0,0.14); color: var(--star-tho); }
    .star-chip.transit.moc { background: rgba(4,154,4,0.12); color: var(--star-moc); }
    .star-chip::before { content: ''; }
    .star-phase { font-size: 9px; font-weight: 800; opacity: 0.8; }
  </style>
</head>
<body>
  
  <div id="formScreen" class="screen">
    <div class="app-brand">V0.3 BETA</div>
    <div class="form-shell">
    <div class="page-viewport"><div id="pageTrack" class="page-track">
    <section id="settingsPage" class="app-page settings-page" aria-label="Cài đặt">
      <h2 class="page-heading">Cài đặt</h2>
      <p class="page-description"></p>
      <div class="settings-list">
        <div class="setting-row">
          <label for="inpTimezone">Múi giờ</label>
          <input type="text" id="inpTimezone" class="oneui-input" value="GMT+07:00" placeholder="GMT+07:00" inputmode="text">
          <p class="setting-hint">Ví dụ: GMT+07:00. Múi giờ được dùng khi quy đổi ngày dương sang âm lịch.</p>
        </div>
        <div class="setting-row">
          <span class="setting-title">Giao diện</span>
          <span class="setting-hint">Chọn theo hệ thống hoặc cố định giao diện bạn thích.</span>
          <div class="theme-options" role="group" aria-label="Giao diện">
            <button type="button" class="theme-option" data-theme-choice="light">Sáng</button>
            <button type="button" class="theme-option" data-theme-choice="dark">Tối</button>
            <button type="button" class="theme-option active" data-theme-choice="system">Hệ thống</button>
          </div>
        </div>
      </div>
    </section>

    <section id="anSaoPage" class="app-page" aria-label="An sao">
    <header class="oneui-header">
      <h1 class="header-title">Zen.Hua</h1>
      <p class="header-subtitle">Dựa trên thuật toán của Thầy Cao Anh</p>
    </header>
    <main class="oneui-card-form">
      <div class="input-group">
        <label class="oneui-label">Họ và tên</label>
        <input type="text" id="inpName" class="oneui-input" value="Đương Số">
      </div>
      <div class="input-group">

  <script type="module">
    import { generate_chart } from './src/generate_chart.js';

    const STORAGE_KEY = 'zenhua.app-state.v1';
    const defaultAppState = { timezone: 'GMT+07:00', theme: 'system', history: [], bookmarks: [] };
    function loadAppState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return { ...defaultAppState, ...(saved || {}), history: Array.isArray(saved?.history) ? saved.history : [], bookmarks: Array.isArray(saved?.bookmarks) ? saved.bookmarks : [] };
      } catch { return { ...defaultAppState }; }
    }
    let appState = loadAppState();
    function persistAppState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }

    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    function syncSystemTheme() {
      const theme = appState.theme === 'system' ? (systemTheme.matches ? 'dark' : 'light') : appState.theme;
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll('[data-theme-choice]').forEach((button) => button.classList.toggle('active', button.dataset.themeChoice === appState.theme));
    }
    syncSystemTheme();
    systemTheme.addEventListener('change', syncSystemTheme);
    
    function removeVietnameseTones(str) {
      if (!str) return '';
      return str
        .normalize('NFD') // Separate base characters from their accent marks
        .replace(/[\u0300-\u036f]/g, '') // Remove the accent marks
        .replace(/đ/g, 'd') // Replace lowercase đ
        .replace(/Đ/g, 'D') // Replace uppercase Đ
        .trim();
    }


    // ==========================================
    // RENDER COMPONENT FUNCTIONS
    // ==========================================

    function renderStarChip(star, isMajor = false) {
      const starName = star.name; 
      const elementClass = star.element
      return `<span class="star-chip ${isMajor ? 'major' : ''} ${elementClass}">${starName}</span>`;
    }

    function renderTransitChip(star) {
      const starName = star.name; 
      const elementClass = star.element
      return `<span class="star-chip transit ${elementClass}">${starName}</span>`;
    }

    function elementClass(element) {
      return removeVietnameseTones(element).toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function renderCenterMetadata(chart) {
      const meta = chart.center_metadata;
      if (!meta) return '';

      const menhPalace = chart.palaces.find((palace) => palace.palace_name === 'MỆNH');
      const majorStarLine = meta.major_star_configuration && meta.major_star_configuration !== 'Không xác định'
        ? meta.major_star_configuration
        : `Mệnh: ${(menhPalace?.major_stars ?? []).map((star) => star.name.replace(/^[+-]/, '')).join(', ')}`;
      const viewingDate = `T${Number(meta.viewing_lunar_month)}/${meta.viewing_lunar_year} ÂL`;

      return `
        <h3 class="center-name">${escapeHtml(chart.name)}</h3>
        <p class="center-timezone">(${escapeHtml(meta.timezone)}) Giờ Hà Nội</p>
        <div class="center-date-grid">
          <div><span class="center-date-label">Năm</span><span>${meta.birth_year}</span><span>${String(meta.lunar_date).split('/')[2]}</span><span>${escapeHtml(meta.lunar_year_can_chi)}</span></div>
          <div><span class="center-date-label">Tháng</span><span>${meta.birth_month}</span><span>${String(meta.lunar_date).split('/')[1]}</span><span>${escapeHtml(meta.lunar_month_can_chi)}</span></div>
          <div><span class="center-date-label">Ngày</span><span>${meta.birth_day}</span><span>${String(meta.lunar_date).split('/')[0]}</span><span>${escapeHtml(meta.lunar_day_can_chi)}</span></div>
          <div><span class="center-date-label">Giờ</span><span>${String(meta.birth_hour).padStart(2, '0')}:${String(meta.birth_minute).padStart(2, '0')}</span><span>${escapeHtml(meta.hour_can_chi.split(' ').slice(-1)[0])}</span><span>${escapeHtml(meta.hour_can_chi)}</span></div>
        </div>
        <p class="center-line center-highlight">${escapeHtml(meta.sex_label)}, ${escapeHtml(meta.logic_direction)}, ${meta.age} tuổi (${viewingDate})</p>
        <p class="center-line center-highlight">Bản Mệnh: ${escapeHtml(meta.nap_am)} - ${escapeHtml(meta.cuc_name)}</p>
        <p class="center-line center-accent">${escapeHtml(meta.menh_cuc_relation)}</p>
        <div class="center-spacer"></div>
        <p class="center-line center-highlight">${escapeHtml(majorStarLine)}</p>
        <div class="center-spacer"></div>
        <p class="center-line center-accent">Chủ Mệnh: ${escapeHtml(meta.principal_star)} - Chủ Thân: ${escapeHtml(meta.body_star)}</p>
        <p class="center-line">Cân xương tính số <span class="center-highlight">${escapeHtml(meta.bone_weight)}</span></p>
        ${meta.cuu_cung_chieu_menh ? `<p class="center-line">Cửu cung chiếu mệnh <span class="center-highlight">${escapeHtml(meta.cuu_cung_chieu_menh)}</span></p>` : ''}
        <div class="center-spacer"></div>
        <p class="center-line center-accent"><strong>Mệnh quái:</strong> ${escapeHtml(meta.life_trigram)}</p>
        <p class="center-line center-accent">Hướng hợp tuổi: ${escapeHtml(meta.favorable_directions)}</p>
        <p class="center-line center-accent">Tuổi Hợp: ${escapeHtml(meta.compatible_ages)}</p>
        ${meta.kim_lau_hoang_oc ? `<div class="center-spacer"></div><p class="center-line center-accent">${escapeHtml(meta.kim_lau_hoang_oc)}</p>` : ''}
        ${meta.tam_tai ? `<p class="center-line center-accent">${escapeHtml(meta.tam_tai)}</p>` : ''}
      `;
    }

    const PALACE_GRID_POSITIONS = [
      [0, 0], [1, 0], [2, 0], [3, 0],
      [0, 1], [3, 1], [0, 2], [3, 2],
      [0, 3], [1, 3], [2, 3], [3, 3],
    ];
    const PALACE_WIDTH = 250;
    const PALACE_HEIGHT = 337;

    function markerPosition(indexes) {
      const [firstIndex, secondIndex] = indexes;
      const first = PALACE_GRID_POSITIONS[firstIndex];
      const second = PALACE_GRID_POSITIONS[secondIndex];
      if (!first || !second) return null;

      const [firstColumn, firstRow] = first;
      const [secondColumn, secondRow] = second;
      if (firstRow === secondRow) {
        // Horizontal pairs occupy either the top or bottom edge of the chart.
        // Their marker sits on the edge facing the central four-card space.
        return {
          x: ((firstColumn + secondColumn + 1) * PALACE_WIDTH) / 2,
          y: (firstRow < 2 ? firstRow + 1 : firstRow) * PALACE_HEIGHT,
        };
      }
      // Stacked pairs share a horizontal divider, so place the marker directly
      // in the middle of that divider (for example, [4, 0]).
      return {
        x: ((firstColumn + secondColumn + 1) * PALACE_WIDTH) / 2,
        y: ((firstRow + secondRow + 1) * PALACE_HEIGHT) / 2,
      };
    }

    function addTuanTrietMarker(label, indexes, className) {
      const position = markerPosition(indexes);
      if (!position) return;
      const marker = document.createElement('div');
      marker.className = `tuan-triet-marker ${className}`;
      marker.textContent = label;
      marker.style.left = `${position.x}px`;
      marker.style.top = `${position.y}px`;
      document.getElementById('tuviChart').appendChild(marker);
    }

    function renderTuanTriet(chart) {
      const metadata = chart.center_metadata;
      const tuan = metadata?.tuan_palace_indexes;
      const triet = metadata?.triet_palace_indexes;
      document.querySelectorAll('.tuan-triet-marker').forEach((marker) => marker.remove());
      if (!Array.isArray(tuan) || tuan.length !== 2 || !Array.isArray(triet) || triet.length !== 2) return;

      const shared = metadata.tuan_triet_shared || (tuan[0] === triet[0] && tuan[1] === triet[1]);
      if (shared) {
        addTuanTrietMarker('TUẦN / TRIỆT', tuan, 'tuan-triet-shared-marker');
        return;
      }
      addTuanTrietMarker('TUẦN', tuan, 'tuan-marker');
      addTuanTrietMarker('TRIỆT', triet, 'triet-marker');
    }

    function renderPalaceCard(palace, element) {
      const majorStars = palace.major_stars
      const leftColStars = palace.left_stars
      const rightColStars = palace.right_stars

      // Core Palace Info Mapping
      const pm_name = palace.palace_name

      const pm_l1 = `${palace.stem[0]}.${palace.branch}`
      const pm_l2 = `${palace.polarity}${palace.element}`
      
      const pm_r1 = `${palace.dai_van_start_age}`
      const pm_r2 = `${palace.month_label}`
      
      const pb_l = `${palace.dai_van_label}`
      const pb_r = `${palace.luu_nien_label}`
      
      const pb_m1 = `${palace.footer_track_label.toUpperCase()}`
      const pb_m2 = `${palace.truong_sinh}`
      
      // Transit Mapping
      element.innerHTML = `
        <div class="palace-header">
          <div class="palace-left-meta">
            <span>${pm_l1}</span>
            <span>${pm_l2}</span>
          </div>
          <div class="palace-title ${elementClass(palace.element)}">
            ${pm_name}
          </div>
          <div class="palace-right-meta">
            <span>${pm_r1}</span>
            <span>${pm_r2}</span>
          </div>
        </div>
        <div class="palace-major-stars">
          ${majorStars.length ? majorStars.map(star => renderStarChip(star, true)).join('') : '<span class="star-chip">—</span>'}
        </div>
        <div class="palace-middle">
          <div class="palace-star-col">
            <div class="palace-star-list">
              ${leftColStars.length ? leftColStars.map(star => renderStarChip(star)).join('') : '<span class="star-chip">—</span>'}
            </div>
          </div>
          <div class="palace-star-col">
            <div class="palace-star-list">
              ${rightColStars.length ? rightColStars.map(star => renderStarChip(star)).join('') : '<span class="star-chip">—</span>'}
            </div>
          </div>
        </div>
        <div class="palace-bottom">
          <span class="palace-bottom-left">${pb_l}</span>
          <div class="palace-bottom-center">
            <span class="palace-lunar-mansion">${pb_m1}</span>
            <span class="palace-trang-sinh">${pb_m2}</span>
          </div>
          <span class="palace-bottom-right">${pb_r}</span>
        </div>
      `;
    }

    // ==========================================
    // MASTER ENGINE EXECUTION 
    // ==========================================

    function runEngine(name, isNam, birthDate, birthTime, viewingDate, isSolarCalendar) {
      const sex = isNam ? 1 : 2;
      const { day, month, year } = birthDate;
      const { hour, minute } = birthTime;
      const yearcalc = viewingDate.year;
      const monthcalc = viewingDate.month;
      const convert_to_lunar = isSolarCalendar;
      const timezone = getTimezone();

      const chart = generate_chart(
        sex,
        day,
        month,
        year,
        hour,
        minute,
        yearcalc,
        monthcalc,
        convert_to_lunar,
        name,
        viewingDate.day,
        isSolarCalendar,
        timezone.offset,
        timezone.label,
      );

      return chart;
    }

    // ==========================================
    // UI CONTROLLERS
    // ==========================================

    function dateControlValue(prefix) {
      const day = document.getElementById(`${prefix}Day`).value;
      const month = document.getElementById(`${prefix}Month`).value;
      const year = document.getElementById(`${prefix}Year`).value;
      return `${day}/${month}/${year}`;
    }

    function readDateControl(prefix, isSolar = isSolarCalendar) {
      const [dayText, monthText, yearText] = dateControlValue(prefix).split('/');
      if (!/^\d{2}$/.test(dayText) || !/^\d{2}$/.test(monthText) || !/^\d{4}$/.test(yearText)) return null;
      const day = Number(dayText);
      const month = Number(monthText);
      const year = Number(yearText);
      if (isSolar) {
        const check = new Date(year, month - 1, day);
        if (check.getFullYear() !== year || check.getMonth() !== month - 1 || check.getDate() !== day) return null;
      } else if (day > 30 || month > 12) {
        return null;
      }
      return { day, month, year, display: `${dayText}/${monthText}/${yearText}` };
    }

    function setDateControlValue(prefix, value) {
      const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
      if (!match) return;
      const [, day, month, year] = match;
      document.getElementById(`${prefix}Day`).value = day;
      document.getElementById(`${prefix}Month`).value = month;
      document.getElementById(`${prefix}Year`).value = year;
    }

    function setupDateControl(prefix) {
      const segments = ['Day', 'Month', 'Year'].map((part) => document.getElementById(`${prefix}${part}`));
      segments.forEach((segment, index) => {
        segment.addEventListener('focus', () => segment.select());
        segment.addEventListener('click', () => segment.select());
        segment.addEventListener('input', () => {
          segment.value = segment.value.replace(/\D/g, '');
          const digit = Number(segment.value);
          const isSingleDigit = segment.value.length === 1;
          const shouldComplete = index < 2 && isSingleDigit && digit >= 1;
          if (shouldComplete) segment.value = `0${segment.value}`;
          if (segment.value.length === segment.maxLength && index < segments.length - 1) segments[index + 1].focus();
        });
      });
    }

    function timeControlValue(prefix) {
      return `${document.getElementById(`${prefix}Hour`).value}:${document.getElementById(`${prefix}Minute`).value}`;
    }

    function readTimeControl(prefix) {
      const [hourText, minuteText] = timeControlValue(prefix).split(':');
      if (!/^(?:[01]\d|2[0-3])$/.test(hourText) || !/^[0-5]\d$/.test(minuteText)) return null;
      return { hour: Number(hourText), minute: Number(minuteText) };
    }

    function setupTimeControl(prefix) {
      const segments = ['Hour', 'Minute'].map((part) => document.getElementById(`${prefix}${part}`));
      segments.forEach((segment, index) => {
        segment.addEventListener('focus', () => segment.select());
        segment.addEventListener('click', () => segment.select());
        segment.addEventListener('input', () => {
          segment.value = segment.value.replace(/\D/g, '');
          const digit = Number(segment.value);
          const isSingleDigit = segment.value.length === 1;
          const shouldComplete = (index === 0 && isSingleDigit && digit >= 3)
            || (index === 1 && isSingleDigit && digit >= 6);
          if (shouldComplete) segment.value = `0${segment.value}`;
          if (segment.value.length === segment.maxLength && index < segments.length - 1) segments[index + 1].focus();
        });
      });
    }

    const today = new Date();
    setDateControlValue('inpViewingDate', [
      String(today.getDate()).padStart(2, '0'),
      String(today.getMonth() + 1).padStart(2, '0'),
      today.getFullYear()
    ].join('/'));

    ['inpBirthDate', 'inpViewingDate', 'inpLiveViewDate'].forEach(setupDateControl);
    setupTimeControl('inpBirthTime');
    
    let isNam = true;
    let isSolarCalendar = true;
    let currentChartRecord = null;

    function getTimezone() {
      const raw = document.getElementById('inpTimezone').value.trim().toUpperCase();
      const match = /^GMT\s*([+-])(\d{1,2})(?::?(\d{2}))?$/.exec(raw);
      if (!match) return { offset: 7, label: 'GMT+07:00' };
      const offset = (Number(match[2]) + Number(match[3] || 0) / 60) * (match[1] === '-' ? -1 : 1);
      if (offset < -12 || offset > 14) return { offset: 7, label: 'GMT+07:00' };
      return { offset, label: `GMT${match[1]}${String(match[2]).padStart(2, '0')}:${match[3] || '00'}` };
    }
    function saveSettings() {
      const timezone = getTimezone();
      document.getElementById('inpTimezone').value = timezone.label;
      appState.timezone = timezone.label;
      persistAppState();
    }
    document.getElementById('inpTimezone').value = appState.timezone;
    document.getElementById('inpTimezone').addEventListener('change', saveSettings);
    document.querySelectorAll('[data-theme-choice]').forEach((button) => button.addEventListener('click', () => {
      appState.theme = button.dataset.themeChoice;
      persistAppState();
      syncSystemTheme();
    }));

    function recordKey(record) {
      return [record.name, record.isNam, record.isSolarCalendar, record.birthDate, record.birthTime, record.viewingDate, record.timezone].join('|');
    }
    function formRecord() {
      return {
        name: document.getElementById('inpName').value.trim() || 'Đương Số',
        isNam,
        isSolarCalendar,
        birthDate: dateControlValue('inpBirthDate'),
        birthTime: timeControlValue('inpBirthTime'),
        viewingDate: dateControlValue('inpViewingDate'),
        timezone: getTimezone().label,
        savedAt: Date.now(),
      };
    }
    function isBookmarked(record) { return appState.bookmarks.some((item) => recordKey(item) === recordKey(record)); }
    function saveToHistory(record) {
      const key = recordKey(record);
      appState.history = [record, ...appState.history.filter((item) => recordKey(item) !== key)].slice(0, 30);
      persistAppState();
      renderLibrary();
    }
    function renderLibraryCard(record) {
      const calendar = record.isSolarCalendar ? 'Dương lịch' : 'Âm lịch';
      return `<button type="button" class="library-card" data-record-key="${escapeHtml(recordKey(record))}">
        <span class="library-card-name">${escapeHtml(record.name)}${isBookmarked(record) ? ' · Đã ghim' : ''}</span>
        <span class="library-card-detail">${record.isNam ? 'Nam' : 'Nữ'} · ${escapeHtml(record.birthDate)} ${escapeHtml(record.birthTime)} · ${calendar}<br>${escapeHtml(record.viewingDate)} · ${escapeHtml(record.timezone)}</span>
      </button>`;
    }
    function renderLibrary() {
      const target = document.getElementById('libraryContent');
      const history = appState.history;
      target.innerHTML = `
        <section><p class="library-section-title">Đã ghim</p>${appState.bookmarks.length ? appState.bookmarks.map(renderLibraryCard).join('') : '<p class="empty-library">Chưa có lá số được ghim.</p>'}</section>
        <section><p class="library-section-title">Gần đây</p>${history.length ? history.map(renderLibraryCard).join('') : '<p class="empty-library">Lá số bạn tạo sẽ xuất hiện ở đây.</p>'}</section>`;
      target.querySelectorAll('[data-record-key]').forEach((button) => button.addEventListener('click', () => {
        const key = button.dataset.recordKey;
        const record = [...appState.bookmarks, ...appState.history].find((item) => recordKey(item) === key);
        if (record) restoreChart(record);
      }));
    }
    function restoreChart(record) {
      document.getElementById('inpName').value = record.name;
      setDateControlValue('inpBirthDate', record.birthDate);
      setDateControlValue('inpViewingDate', record.viewingDate);
      const [hour, minute] = record.birthTime.split(':');
      document.getElementById('inpBirthTimeHour').value = hour;
      document.getElementById('inpBirthTimeMinute').value = minute;
      document.getElementById('inpTimezone').value = record.timezone;
      isNam = record.isNam;
      isSolarCalendar = record.isSolarCalendar;
      document.getElementById('btnNam').classList.toggle('active', isNam);
      document.getElementById('btnNu').classList.toggle('active', !isNam);
      document.getElementById('btnSolarCalendar').classList.toggle('active', isSolarCalendar);
      document.getElementById('btnLunarCalendar').classList.toggle('active', !isSolarCalendar);
      syncCalendarSuffixes();
      openChart();
    }
    function setActivePage(index) {
      document.getElementById('pageTrack').style.transform = `translate3d(${-index * (window.innerWidth + 20)}px, 0, 0)`;
      document.querySelectorAll('.nav-item').forEach((button) => button.classList.toggle('active', Number(button.dataset.page) === index));
    }
    document.querySelectorAll('.nav-item').forEach((button) => button.addEventListener('click', () => setActivePage(Number(button.dataset.page))));
    window.addEventListener('resize', () => setActivePage(Number(document.querySelector('.nav-item.active')?.dataset.page || 1)));
    setActivePage(1);
    renderLibrary();
    function syncCalendarSuffixes() {
      document.querySelectorAll('.calendar-suffix').forEach((suffix) => suffix.classList.toggle('visible', !isSolarCalendar));
    }
    document.getElementById("btnNam").addEventListener("click", () => { 
      isNam = true; 
      document.getElementById("btnNam").classList.add("active"); 
      document.getElementById("btnNu").classList.remove("active"); 
    });
    document.getElementById("btnNu").addEventListener("click", () => { 
      isNam = false; 
      document.getElementById("btnNu").classList.add("active"); 
      document.getElementById("btnNam").classList.remove("active"); 
    });
    document.getElementById("btnSolarCalendar").addEventListener("click", () => {
      isSolarCalendar = true;
      syncCalendarSuffixes();
      document.getElementById("btnSolarCalendar").classList.add("active");
      document.getElementById("btnLunarCalendar").classList.remove("active");
    });
    document.getElementById("btnLunarCalendar").addEventListener("click", () => {
      isSolarCalendar = false;
      syncCalendarSuffixes();
      document.getElementById("btnLunarCalendar").classList.add("active");
      document.getElementById("btnSolarCalendar").classList.remove("active");
    });

    function updateChartUI() {
      const name = document.getElementById("inpName").value;
      const birthDate = readDateControl('inpBirthDate');
      const birthTime = readTimeControl('inpBirthTime');
      const viewingDate = readDateControl('inpViewingDate');
      if (!birthDate || !viewingDate || !birthTime) {
        alert("Vui lòng nhập ngày DD/MM/YYYY và giờ HH:MM hợp lệ.");
        return;
      }
      setDateControlValue('inpLiveViewDate', dateControlValue('inpViewingDate'));

      const chart = runEngine(name, isNam, birthDate, birthTime, viewingDate, isSolarCalendar);

      document.getElementById("txtSummaryName").innerText = chart.name;
      document.getElementById("txtSummarySub").innerText = `${chart.center_metadata.sex_label} · ${chart.center_metadata.lunar_year_can_chi}`;
      document.getElementById("lblCenterMeta").innerHTML = renderCenterMetadata(chart);

      chart.palaces.forEach((p, idx) => {
        const dom = document.getElementById(`pal-${idx}`);
        if (dom) {
          renderPalaceCard(p, dom);
        }
      });
      renderTuanTriet(chart);
      return chart;
    }

    function openChart() {
      if (!updateChartUI()) return;
      currentChartRecord = formRecord();
      saveToHistory(currentChartRecord);
      document.getElementById('btnBookmark').classList.toggle('active', isBookmarked(currentChartRecord));
      document.getElementById("formScreen").classList.add("hidden");
      document.getElementById("chartScreen").classList.remove("hidden");
      window.scrollTo(0, 0);
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
        fitChartToViewport();
      });
    }
    document.getElementById("btnSubmit").addEventListener("click", openChart);
    
    document.getElementById("btnBack").addEventListener("click", () => {
      document.getElementById("chartScreen").classList.add("hidden");
      document.getElementById("formScreen").classList.remove("hidden");
    });
    document.getElementById('btnBookmark').addEventListener('click', () => {
      if (!currentChartRecord) return;
      const key = recordKey(currentChartRecord);
      if (isBookmarked(currentChartRecord)) {
        appState.bookmarks = appState.bookmarks.filter((item) => recordKey(item) !== key);
      } else {
        appState.bookmarks = [{ ...currentChartRecord }, ...appState.bookmarks.filter((item) => recordKey(item) !== key)];
      }
      persistAppState();
      document.getElementById('btnBookmark').classList.toggle('active', isBookmarked(currentChartRecord));
      renderLibrary();
    });
    
    ['inpLiveViewDateDay', 'inpLiveViewDateMonth', 'inpLiveViewDateYear'].forEach((id) => document.getElementById(id).addEventListener("change", () => {
      const liveDate = dateControlValue('inpLiveViewDate');
      if (!readDateControl('inpLiveViewDate')) {
        return;
      }
      setDateControlValue('inpViewingDate', liveDate);
      updateChartUI();
    }));

    async function downloadChartFile(chartData) {
      const data = JSON.stringify(chartData, null, 2);
      const filename = `${removeVietnameseTones(chartData.name || 'la-so-tu-vi').replace(/\s+/g, '-').toLowerCase()}.json`;
      const nativeDownload = window.Capacitor?.Plugins?.ChartDownload;
      if (window.Capacitor?.isNativePlatform?.() && nativeDownload) {
        await nativeDownload.save({ fileName: filename, content: data });
        return;
      }
      const file = new Blob([data], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(file);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    document.getElementById('btnDownload').addEventListener('click', async () => {
      const chartData = updateChartUI();
      if (!chartData) return;
      try {
        await downloadChartFile(chartData);
      } catch (error) {
        alert('Không thể lưu lá số. Vui lòng thử lại.');
        return;
      }
      const downloadButton = document.getElementById('btnDownload');
      downloadButton.classList.remove('downloaded');
      void downloadButton.offsetWidth;
      downloadButton.classList.add('downloaded');
      setTimeout(() => downloadButton.classList.remove('downloaded'), 750);
    });

    // ==========================================
    // PAN & ZOOM GESTURES
    // ==========================================
    
    let scale = 0.8, x = 20, y = 40;
    let isDragging = false, startX = 0, startY = 0, initX = 0, initY = 0;
    let initDist = 0, baseScale = 1;
    let pinchAnchorX = 0, pinchAnchorY = 0;
    const mask = document.getElementById("viewportMask");
    const chart = document.getElementById("tuviChart");

    function fitChartToViewport() {
      const padding = 12;
      const availableWidth = Math.max(0, mask.clientWidth - padding * 2);
      const availableHeight = Math.max(0, mask.clientHeight - padding * 2);
      scale = Math.min(availableWidth / 1000, availableHeight / 1348);
      x = (mask.clientWidth - 1000 * scale) / 2;
      y = (mask.clientHeight - 1348 * scale) / 2;
      applyTransform();
    }

    mask.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initX = x;
        initY = y;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        baseScale = scale;

        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        pinchAnchorX = (centerX - x) / scale;
        pinchAnchorY = (centerY - y) / scale;
      }
    }, { passive: true });

    mask.addEventListener("touchmove", (e) => {
      if (isDragging && e.touches.length === 1) {
        x = initX + (e.touches[0].clientX - startX);
        y = initY + (e.touches[0].clientY - startY);
        applyTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const nextScale = Math.min(Math.max(baseScale * (dist / initDist), 0.4), 2.5);

        x = centerX - nextScale * pinchAnchorX;
        y = centerY - nextScale * pinchAnchorY;
        scale = nextScale;
        applyTransform();
      }
    }, { passive: true });

    mask.addEventListener("touchend", () => { isDragging = false; });
    function applyTransform() { chart.style.setProperty("--x", `${x}px`); chart.style.setProperty("--y", `${y}px`); chart.style.setProperty("--scale", scale); }
    applyTransform();
  </script>
</body>
