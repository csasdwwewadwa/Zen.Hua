    function removeVietnameseTones(str) {
      if (!str) return '';
      

      return str
        .normalize('NFD') // Separate base characters from their accent marks
        .replace(/[\u0300-\u036f]/g, '') // Remove the accent marks
        .replace(/đ/g, 'd') // Replace lowercase đ
        .replace(/Đ/g, 'D') // Replace uppercase Đ
        .trim();
    }

    function convertDictValues(obj, func) {
      const newObj = {};
      
      for (const [key, value] of Object.entries(obj)) {
        // Only convert if the value is a string, otherwise keep it as-is
        newObj[key] = (typeof value === 'string') ? func(value) : value;
      }
      
      return newObj;
    }

    VI_STAR_ELEMENTS = convertDictValues(VI_STAR_ELEMENTS, (x) => removeVietnameseTones(x).toLowerCase())
    

    // ==========================================
    // RENDER COMPONENT FUNCTIONS
    // ==========================================

    function classifyTransitStar(name) {
      const inauspiciousNames = ['Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Địa Không', 'Địa Kiếp', 'Thiên Không', 'Kiếp Sát', 'Đại Hao', 'Tiểu Hao', 'Thiên Khốc', 'Thiên Hư', 'Tang Môn', 'Bạch Hổ', 'Thiên Hình', 'Thiên Diêu', 'Phục Binh', 'Tuế Phá', 'Điếu Khách'];
      const baseName = name.replace(/^Lưu\s+/, '');
      return inauspiciousNames.includes(baseName) ? 'inauspicious' : 'auspicious';
    }

    function formatStarPhases(star) {
      if (star.brightness) {
        return typeof star.brightness === 'object' ? `(${star.brightness.value[0]})` : `(${star.brightness[0]})`;
      }
      return '';
    }

    function renderStarChip(star, isMajor = false) {
      const phaseLabel = formatStarPhases(star);
      const starName = star.name; 
      const elementClass = VI_STAR_ELEMENTS[starName] || '';
      return `<span class="star-chip ${isMajor ? 'major' : ''} ${elementClass}">${starName}${phaseLabel}</span>`;
    }

    function renderTransitChip(star) {
      const name = star.name; 
      const category = classifyTransitStar(name);
      const baseStarName = name.replace(/^Lưu\s+/, '');
      const elementClass = VI_STAR_ELEMENTS[baseStarName] || '';
      const shortName = name.replace(/^Lưu\s+/, 'L.');
      
      return `<span class="star-chip transit ${category} ${elementClass}">${shortName}</span>`;
    }

    function renderPalaceCard(palace, element) {
      const majorStars = palace.majorStars || [];
      
      // Core setup to filter auspicious vs inauspicious minor & adjective stars
      const inauspiciousNames = ['Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Địa Không', 'Địa Kiếp', 'Thiên Không', 'Kiếp Sát', 'Đại Hao', 'Tiểu Hao', 'Thiên Khốc', 'Thiên Hư', 'Tang Môn', 'Bạch Hổ', 'Thiên Hình', 'Thiên Diêu', 'Phá Toái', 'Phục Binh', 'Quan Phủ', 'Quan Phù', 'Tuế Phá', 'Điếu Khách'];
      
      const allMinor = [
        ...(palace.minorStars || []),
        ...(palace.adjectiveStars || [])
      ];

      const auspiciousStars = allMinor.filter(star => !inauspiciousNames.includes(star.name));
      const inauspiciousStars = allMinor.filter(star => inauspiciousNames.includes(star.name));

      // Core Palace Info Mapping
      const canChi = `${palace.heavenlyStem[0] || '—'}.${palace.earthlyBranch || '—'}`.trim();
      const elementName = palace.fiveElements || '—'; 
      
      const daiHan = palace.decadal?.range ? `${palace.decadal.range[0]} - ${palace.decadal.range[1]}` : '—';
      const thangHan = palace.ages ? palace.ages.join(', ') : '—'; // Used ages for Tiểu Hạn
      
      const changkong = (palace.changkongStars || []).map(s => s.name).join('/');
      const dynamicRole = changkong || '—';

      const luuNien = palace.yearlyIndex !== undefined ? `LN.${palace.yearlyIndex}` : '—';
      
      const lunarMansion = palace.suiqian12 || palace.jiangxing12 || '—'; 
      const trangSinh = palace.changsheng12 || '—';
      
      // Transit Mapping
      const transitStars = palace.horoscopeStars || [];
      const transitAuspicious = transitStars.filter(star => classifyTransitStar(star.name) === 'auspicious');
      const transitInauspicious = transitStars.filter(star => classifyTransitStar(star.name) === 'inauspicious');

      element.innerHTML = `
        <div class="palace-header">
          <div class="palace-left-meta">
            <span>${canChi}</span>
            ${elementName ? `<span>${elementName}</span>` : ''}
          </div>
          <div class="palace-title">
            ${palace.name}
          </div>
          <div class="palace-right-meta">
            <span>${daiHan}</span>
            <span style="max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${thangHan}">${thangHan}</span>
          </div>
        </div>
        <div class="palace-major-stars">
          ${majorStars.length ? majorStars.map(star => renderStarChip(star, true)).join('') : '<span class="star-chip">—</span>'}
        </div>
        <div class="palace-middle">
          <div class="palace-star-col">
            <div class="palace-star-list">
              ${auspiciousStars.length ? auspiciousStars.map(star => renderStarChip(star)).join('') : '<span class="star-chip">—</span>'}
            </div>
            ${transitAuspicious.length ? `<div class="palace-transit-list">${transitAuspicious.map(renderTransitChip).join('')}</div>` : ''}
          </div>
          <div class="palace-star-col">
            <div class="palace-star-list">
              ${inauspiciousStars.length ? inauspiciousStars.map(star => renderStarChip(star)).join('') : '<span class="star-chip">—</span>'}
            </div>
            ${transitInauspicious.length ? `<div class="palace-transit-list">${transitInauspicious.map(renderTransitChip).join('')}</div>` : ''}
          </div>
        </div>
        <div class="palace-bottom">
          <span class="palace-bottom-left">${dynamicRole}</span>
          <div class="palace-bottom-center">
            <span class="palace-lunar-mansion">${lunarMansion}</span>
            <span class="palace-trang-sinh">${trangSinh}</span>
          </div>
          <span class="palace-bottom-right">${luuNien}</span>
        </div>
      `;
    }

    // ==========================================
    // MASTER ENGINE EXECUTION 
    // ==========================================

    function runEngine(name, isNam, bDateStr, bTimeStr, vDateStr) {
      const birthDate = new Date(`${bDateStr}T${bTimeStr || '00:00'}`);
      const hour = birthDate.getHours();
      
      const iztroHourIndex = Math.floor((hour + 1) % 24 / 2);
      const genderStr = isNam ? 'male' : 'female';

      const astrolabe = astro.bySolar(bDateStr, iztroHourIndex, genderStr, true, 'vi-VN');
      const viewDate = new Date(vDateStr);
      const targetYear = viewDate.getFullYear();
      
      const horoscope = astrolabe.horoscope(vDateStr, iztroHourIndex);

      // Using horoscope.astrolabe to ensure transit logic binds correctly if available
      const baseAstrolabe = horoscope.astrolabe || astrolabe;

      const processedPalaces = baseAstrolabe.palaces.map((palace, index) => ({
        id: index,
        ...palace,
        horoscopeStars: palace.horoscopeStars || []
      }));

      const birthStem = astrolabe.yearStem || astrolabe.yearly?.heavenlyStem || '';
      const birthBranch = astrolabe.yearBranch || astrolabe.yearly?.earthlyBranch || '';
      const viewStem = horoscope.yearly?.heavenlyStem || '';
      const viewBranch = horoscope.yearly?.earthlyBranch || '';

      return {
        name,
        metaInfo: `${isNam ? 'Nam Mệnh' : 'Nữ Mệnh'} • Can Chi Năm Sinh: ${birthStem} ${birthBranch}`,
        viewingInfo: `Xem hạn năm: ${viewStem} ${viewBranch} (${targetYear})`,
        palaces: processedPalaces
      };
    }

    // ==========================================
    // UI CONTROLLERS
    // ==========================================
    
    let isNam = true;
    document.getElementById("btnNam").addEventListener("click", () => { 
      isNam = true; 
      document.getElementById("btnNam").classList.add("active"); 
      document.getElementById("btnNu").classList.remove("active"); 
    });
    document.getElementById("btnNu").addEventListener("click", () => { 
      isNam = false; 
      document.getElementById("btnNu").classList.add("active"); 
      document.getElementById("btnNam").classList.remove("active"); 
    });

    function updateChartUI() {
      const name = document.getElementById("inpName").value;
      const bDate = document.getElementById("inpBirthDate").value;
      const bTime = document.getElementById("inpBirthTime").value;
      const vDate = document.getElementById("inpViewingDate").value;
      document.getElementById("inpLiveViewDate").value = vDate;

      const data = runEngine(name, isNam, bDate, bTime, vDate);

      document.getElementById("txtSummaryName").innerText = data.name;
      document.getElementById("txtSummarySub").innerText = data.metaInfo;
      document.getElementById("lblCenterMeta").innerHTML = `<b>${data.metaInfo}</b><br><br><span style="color:#1b6ef3; font-weight:bold;">${data.viewingInfo}</span>`;

      data.palaces.forEach(p => {
        const dom = document.getElementById(`pal-${p.id}`);
        if (dom) {
          renderPalaceCard(p, dom);
        }
      });
    }

    document.getElementById("btnSubmit").addEventListener("click", () => {
      updateChartUI();
      document.getElementById("formScreen").classList.add("hidden");
      document.getElementById("chartScreen").classList.remove("hidden");
    });
    
    document.getElementById("btnBack").addEventListener("click", () => {
      document.getElementById("chartScreen").classList.add("hidden");
      document.getElementById("formScreen").classList.remove("hidden");
    });
    
    document.getElementById("inpLiveViewDate").addEventListener("change", (e) => {
      document.getElementById("inpViewingDate").value = e.target.value;
      updateChartUI();
    });

    // ==========================================
    // PAN & ZOOM GESTURES
    // ==========================================
    
    let scale = 0.8, x = 20, y = 40;
    let isDragging = false, startX = 0, startY = 0, initX = 0, initY = 0;
    let initDist = 0, baseScale = 1;
    let pinchAnchorX = 0, pinchAnchorY = 0;
    const mask = document.getElementById("viewportMask");
    const chart = document.getElementById("tuviChart");

    mask.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initX = x;
        initY = y;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        baseScale = scale;

        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        pinchAnchorX = (centerX - x) / scale;
        pinchAnchorY = (centerY - y) / scale;
      }
    }, { passive: true });

    mask.addEventListener("touchmove", (e) => {
      if (isDragging && e.touches.length === 1) {
        x = initX + (e.touches[0].clientX - startX);
        y = initY + (e.touches[0].clientY - startY);
        applyTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const nextScale = Math.min(Math.max(baseScale * (dist / initDist), 0.4), 2.5);

        x = centerX - nextScale * pinchAnchorX;
        y = centerY - nextScale * pinchAnchorY;
        scale = nextScale;
        applyTransform();
      }
    }, { passive: true });

    mask.addEventListener("touchend", () => { isDragging = false; });
    function applyTransform() { chart.style.setProperty("--x", `${x}px`); chart.style.setProperty("--y", `${y}px`); chart.style.setProperty("--scale", scale); }
    applyTransform();
  </script>
